version: '3.8'

services:
  # MongoDB服务
  mongo:
    image: mongo:5.0
    container_name: competition-mongo
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - competition-network

  # 后端API服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: competition-backend
    restart: always
    depends_on:
      - mongo
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/competition-system
      - JWT_SECRET=${JWT_SECRET:?Please set JWT_SECRET in .env}
      - JWT_EXPIRE=30d
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - competition-network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: competition-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - competition-network

networks:
  competition-network:
    driver: bridge

volumes:
  mongo-data: